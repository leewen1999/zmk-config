# swanboard_nv - nice!view (this shield is always used together with nice_view)
CONFIG_ZMK_DISPLAY=y

# Landscape layout: use ZMK's built-in status screen instead of the nice_view
# shield's own vertical widget. (The fonts are the ones the nice_view README lists
# for the built-in screen.)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# Show the battery level as a percentage instead of the battery icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Display tweaks (src/display_tweaks.c)
CONFIG_SWANBOARD_DISPLAY_TWEAKS=y
# Bluetooth symbol instead of the Wi-Fi symbol for BLE
CONFIG_SWANBOARD_DISPLAY_BLE_SYMBOL=y
# SETTING layer: settings symbol, POWER layer: power symbol (table in src/display_tweaks.c)
CONFIG_SWANBOARD_DISPLAY_LAYER_SYMBOL=y
# Turn the picture by 180 degrees (experimental, currently off)
# CONFIG_SWANBOARD_DISPLAY_ROTATE_180=y

# Boot picture (160 x 68, src/boot_image_data.c, made by tools/make_boot_image.py)
# The LVGL image widget is not compiled in by default (the built-in status screen has no
# images): without this line the link fails with "undefined reference to lv_img_create".
CONFIG_LV_USE_IMG=y
CONFIG_SWANBOARD_DISPLAY_BOOT_IMAGE=y
# How long it is shown, in milliseconds
CONFIG_SWANBOARD_DISPLAY_BOOT_IMAGE_MS=1000
