# twelvepad (nice!view version) - 12 keys, direct GPIO, nice!view, low battery LED

# Setup mode + low battery LED (src/setup_mode.c)
CONFIG_SETUP_MODE=y

# Needed for the battery level (display + low battery LED)
CONFIG_ZMK_BATTERY_REPORTING=y

# nice!view (this config assumes it is built as "twelvepad nice_view" in build.yaml;
# a build of plain "twelvepad" without nice_view would fail on these display options)
CONFIG_ZMK_DISPLAY=y

# Landscape layout: use ZMK's built-in status screen instead of the nice_view
# shield's own vertical widget. (The fonts are the ones the nice_view README lists
# for the built-in screen.)
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

# Show the battery level as a percentage instead of the battery icon
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Display tweaks (src/display_tweaks.c)
CONFIG_TWELVEPAD_DISPLAY_TWEAKS=y
# Bluetooth symbol instead of the Wi-Fi symbol for BLE
CONFIG_TWELVEPAD_DISPLAY_BLE_SYMBOL=y
# Turn the picture by 180 degrees (experimental, currently off)
# CONFIG_TWELVEPAD_DISPLAY_ROTATE_180=y

# P0.10 (nice!view MOSI) is an NFC pin: release the NFC pins as normal GPIO.
# (written to the chip once on the first boot, stays in effect afterwards)
CONFIG_NFCT_PINS_AS_GPIOS=y

# ---------------------------------------------------------------------------
# Sleep mode. Enable ONE of the three blocks, comment out the other two.
# ---------------------------------------------------------------------------

# [A] Deep sleep only.
#     - idle timeout (10 minutes) -> deep sleep
#     - setup-mode sleep key (SW10) -> deep sleep
#     Any key wakes the keyboard.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# [B] Soft off only (lowest power).
#     - idle timeout (10 minutes) -> soft off
#     - setup-mode sleep key (SW10) -> soft off
#     No key wakes the keyboard: press the reset button (RST) to wake it.
# CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_PM_SOFT_OFF=y
# CONFIG_SETUP_MODE_SOFT_OFF=y
# CONFIG_SETUP_MODE_SOFT_OFF_TIMEOUT_MS=600000

# [C] Mixed (active).
#     - idle timeout (10 minutes) -> deep sleep, any key wakes the keyboard
#     - setup-mode sleep key (SW10) -> soft off, only the reset button (RST) wakes it
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_SETUP_MODE_SOFT_OFF=y
CONFIG_SETUP_MODE_SOFT_OFF_TIMEOUT_MS=0

# Uncomment to get USB logging (view with a serial terminal) while testing
# CONFIG_ZMK_USB_LOGGING=y
