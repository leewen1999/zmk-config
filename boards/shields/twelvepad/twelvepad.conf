# twelvepad - 12 keys, direct GPIO, 4 indicator LEDs, setup mode

# Setup mode + LED indicator (src/setup_mode.c)
CONFIG_SETUP_MODE=y

# Needed for the battery level display
CONFIG_ZMK_BATTERY_REPORTING=y

# Soft off (used by the sleep sequence)
CONFIG_ZMK_PM_SOFT_OFF=y

# Uncomment to get USB logging (view with a serial terminal) while testing
# CONFIG_ZMK_USB_LOGGING=y
