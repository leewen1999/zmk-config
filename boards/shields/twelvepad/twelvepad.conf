# twelvepad - 15 keys, direct GPIO

# Blink the onboard LED (P0.15) while the active BLE profile is not connected
CONFIG_BLE_STATUS_LED=y

# Enable soft off (&soft_off_hold in the keymap)
CONFIG_ZMK_PM_SOFT_OFF=y

# Uncomment to get USB logging (view with a serial terminal) while testing
# CONFIG_ZMK_USB_LOGGING=y

# Uncomment to disable deep sleep while testing
# CONFIG_ZMK_SLEEP=n
