# twelvepad - 12 keys, direct GPIO, 5 indicator LEDs, setup mode

# Setup mode + LED indicators (src/setup_mode.c)
CONFIG_SETUP_MODE=y

# Needed for the battery level display and the low battery LED
CONFIG_ZMK_BATTERY_REPORTING=y

# P0.09 / P0.10 are used as LED_3 / LED_2: release the NFC pins as normal GPIO.
# (written to the chip once on the first boot, stays in effect afterwards)
CONFIG_NFCT_PINS_AS_GPIOS=y

# ---------------------------------------------------------------------------
# Sleep mode. Pick ONE of the two blocks.
# ---------------------------------------------------------------------------

# [A] Default: ZMK deep sleep.
#     - idle timeout (10 minutes) -> deep sleep
#     - setup-mode sleep key (SW9) -> deep sleep
#     Any key wakes the keyboard.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# [B] Optional: soft off instead of deep sleep.
#     - idle timeout -> soft off
#     - setup-mode sleep key (SW9) -> soft off
#     To use it: comment out block [A] above and uncomment these lines.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_SETUP_MODE_SOFT_OFF=y
CONFIG_SETUP_MODE_SOFT_OFF_TIMEOUT_MS=600000

# Uncomment to get USB logging (view with a serial terminal) while testing
# CONFIG_ZMK_USB_LOGGING=y
