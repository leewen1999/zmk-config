# twelvepad - 12 keys, direct GPIO, 4 indicator LEDs

# Indicator LEDs (src/led_indicator.c)
CONFIG_LED_INDICATOR=y

# Needed for the battery level display
CONFIG_ZMK_BATTERY_REPORTING=y

# Soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# SW10 (SPACE) takes part in 7 combos; the default limit is 5
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=8

# Uncomment to get USB logging (view with a serial terminal) while testing
# CONFIG_ZMK_USB_LOGGING=y
