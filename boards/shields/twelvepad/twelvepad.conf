# twelvepad - 12x1 direct GPIO test build

# Uncomment to get USB logging (view with a serial terminal) while testing
# CONFIG_ZMK_USB_LOGGING=y

# Uncomment to disable deep sleep while testing
# CONFIG_ZMK_SLEEP=n

# Uncomment to adjust the BLE TX power if connection is flaky
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
