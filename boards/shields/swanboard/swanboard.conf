# swanboard (base) - settings shared by every variant.
# Variant settings are in swanboard_led.conf / swanboard_nv.conf / swanboard_cr2032.conf.

# Setup mode + low battery LED (src/setup_mode.c)
CONFIG_SETUP_MODE=y

# Needed for the battery level (display, LED bar, low battery LED)
CONFIG_ZMK_BATTERY_REPORTING=y

# P0.09 / P0.10 are used by the LEDs (LED_3 / LED_2) or by nice!view (MOSI = P0.10):
# release the NFC pins as normal GPIO.
# (written to the chip once on the first boot, stays in effect afterwards)
CONFIG_NFCT_PINS_AS_GPIOS=y

# ---------------------------------------------------------------------------
# Sleep mode. Enable ONE of the three blocks, comment out the other two.
# ---------------------------------------------------------------------------

# [A] Deep sleep only.
#     - idle timeout (10 minutes) -> deep sleep
#     - setup-mode sleep key (SW10) -> deep sleep
#     Any key wakes the keyboard.
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000

# [B] Soft off only (lowest power).
#     - idle timeout (10 minutes) -> soft off
#     - setup-mode sleep key (SW10) -> soft off
#     No key wakes the keyboard: press the reset button (RST) to wake it.
# CONFIG_ZMK_SLEEP=n
# CONFIG_ZMK_PM_SOFT_OFF=y
# CONFIG_SETUP_MODE_SOFT_OFF=y
# CONFIG_SETUP_MODE_SOFT_OFF_TIMEOUT_MS=600000

# [C] Mixed (active).
#     - idle timeout (30 minutes) -> deep sleep, any key wakes the keyboard
#     - setup-mode sleep key (SW10) -> soft off, only the reset button (RST) wakes it
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_SETUP_MODE_SOFT_OFF=y
CONFIG_SETUP_MODE_SOFT_OFF_TIMEOUT_MS=0

# Uncomment to get USB logging (view with a serial terminal) while testing.
# With the two SENSOR lines the log shows "battery NNNN mV -> NN %" for every reading
# (CR2032 variant).
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_SENSOR_LOG_LEVEL_DBG=y

# CONFIG_BT_CTLR_PHY_2M=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# KEYBOARD NAME
# CONFIG_ZMK_KEYBOARD_NAME="SwanBoard"
