description: |
  Battery "wrapper" sensor with a linear voltage -> % mapping (CR2032, LIR2032, ...).
  It reads the battery voltage from another ZMK battery sensor (e.g. the nRF VDDH one)
  and reports its own state of charge, mapped linearly between empty-mv (0 %) and
  full-mv (100 %).

compatible: "swanboard,battery-linear"

include: base.yaml

properties:
  source:
    type: phandle
    required: true
    description: Battery sensor that provides the voltage (SENSOR_CHAN_GAUGE_VOLTAGE)

  full-mv:
    type: int
    default: 3200
    description: Voltage in mV that is shown as 100 %

  empty-mv:
    type: int
    default: 2700
    description: Voltage in mV that is shown as 0 %

  offset-mv:
    type: int
    default: 0
    description: |
      Calibration: this many mV are added to the measured voltage before it is mapped
      (e.g. to compensate a diode drop or the load sag between the battery and the
      measuring point). Can be negative.
